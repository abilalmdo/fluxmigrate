name: Deploy fluxmigrate.com

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, verify, deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm build

      - name: Verify the build
        run: node tools/verify-dist.mjs

      # The contact form (public/contact-submit.php) needs SMTP credentials. They live only in GitHub
      # Actions secrets and are written into dist/ here, after verification, never into the repository.
      # Repository secrets: SMTP_HOST, SMTP_USER, SMTP_PASSWORD (optional: SMTP_PORT, SMTP_SECURE, MAIL_TO).
      - name: Write the mail config from secrets
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # optional: where the newsletter database lives (default: "fm-data" beside the web root) and the link base in its mails
          DATA_DIR: ${{ secrets.DATA_DIR }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node tools/write-mail-config.mjs

      - name: Sync dist/ to the web host over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/

      - name: Check the form endpoint runs and the mail config is private
        run: |
          base=https://www.fluxmigrate.com
          code() { curl -s -o /dev/null -w '%{http_code}' "$base/$1"; }
          # PHP must execute: a GET is refused with 405. A host that prints the source would answer 200.
          for i in 1 2 3; do c=$(code contact-submit.php); [ "$c" = 405 ] && break; sleep 10; done
          [ "$c" = 405 ] || { echo "::error::contact-submit.php answered HTTP $c, expected 405 (is PHP enabled on the host?)"; exit 1; }
          # the captcha endpoint must issue a question (proves PHP, the config and the guard library all load)
          curl -s "$base/contact-captcha.php" | grep -q '"question"' || { echo "::error::contact-captcha.php did not return a question"; exit 1; }
          # newsletter endpoints must run PHP (GET on a POST-only endpoint is 405) and the library must stay private
          c=$(code subscribe.php); [ "$c" = 405 ] || { echo "::error::subscribe.php answered HTTP $c, expected 405"; exit 1; }
          # the credentials, the deploy state and the mail library must not be served
          for p in mail-config.php .ftp-deploy-sync-state.json _form/phpmailer/PHPMailer.php _form/guard.php _form/subscribers.php fm-data/subscribers.sqlite; do
            c=$(code "$p")
            case "$c" in 403|404) ;; *) echo "::error::$p is publicly readable (HTTP $c)"; exit 1 ;; esac
          done
          if curl -s "$base/mail-config.php" | grep -q base64_decode; then echo "::error::mail-config.php content is exposed"; exit 1; fi
          echo "contact endpoint live, config private"
