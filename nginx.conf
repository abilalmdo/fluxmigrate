server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    absolute_redirect off;

    # Pages are built as <slug>.html (astro build.format = "file"). Extensionless URLs
    # resolve too, but every link, canonical and sitemap entry uses the .html form.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Astro fingerprints everything under /_astro/, so it can be cached forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    # Illustrations and icons keep stable names: cache a month.
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    # HTML always revalidates so a deploy is visible immediately.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location = /sitemap-index.xml { add_header Cache-Control "public, max-age=3600"; }
    location ~ ^/sitemap-\d+\.xml$ { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt        { add_header Cache-Control "public, max-age=3600"; }
    location = /site.webmanifest  { default_type application/manifest+json; add_header Cache-Control "public, max-age=86400"; }

    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json image/svg+xml application/manifest+json;

    location ~ ^/(tools|\.github|\.git|docs)/ { deny all; return 404; }
}
