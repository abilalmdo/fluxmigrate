server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    absolute_redirect off;

    # Extensionless URLs resolve to the matching .html file, so /cloud-migration
    # and /cloud-migration.html both work. Production must do the same or the
    # canonical tags and the internal links disagree.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Hashed-by-content assets are not used yet, so keep image caching moderate
    # and revalidate HTML on every request.
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }

    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json image/svg+xml application/manifest+json;

    # The build tools and the design review screenshots are not part of the site.
    location ~ ^/(tools|\.github|\.git)/ { deny all; return 404; }
    location ~ ^/assets/brand/preview/   { deny all; return 404; }
}
